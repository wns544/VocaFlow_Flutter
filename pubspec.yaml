name: vocaflow
description: A calm, focused vocabulary study app.
publish_to: "none"
version: 1.0.22+29

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  shared_preferences: ^2.3.5
  excel: ^4.0.6
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.6.0
  google_sign_in: ^7.2.0
  connectivity_plus: ^6.1.4
  webview_flutter: ^4.13.0
  firebase_storage: ^13.0.6
  path_provider: ^2.1.5
  http: ^1.2.2
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.3
  archive: ^3.6.1
  share_plus: ^10.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.23

flutter:
  uses-material-design: true
  assets:
    - assets/pronunciation/vocaflow-pitch-samples.vfpitch.zip
    - assets/data/kanjium-accents.txt
    - assets/data/hanja_ko.json
    - assets/licenses/hanjadict-LICENSE.txt
    - assets/licenses/KANJIUM-NOTICE.txt
    - assets/licenses/VOICEVOX-CORE-MIT-LICENSE.txt
    - assets/licenses/VOICEVOX-VVM-TERMS-0.16.4.txt
    - assets/licenses/VOICEVOX-ONNXRUNTIME-TERMS.txt
    - assets/licenses/VOICEVOX-ONNXRUNTIME-NOTICES.html
    - assets/voicevox/shikoku-metan.vvm
    - assets/voicevox/open_jtalk_dic_utf_8-1.11/COPYING
    - assets/voicevox/open_jtalk_dic_utf_8-1.11/char.bin
    - assets/voicevox/open_jtalk_dic_utf_8-1.11/left-id.def
    - assets/voicevox/open_jtalk_dic_utf_8-1.11/matrix.bin
    - assets/voicevox/open_jtalk_dic_utf_8-1.11/pos-id.def
    - assets/voicevox/open_jtalk_dic_utf_8-1.11/rewrite.def
    - assets/voicevox/open_jtalk_dic_utf_8-1.11/right-id.def
    - assets/voicevox/open_jtalk_dic_utf_8-1.11/sys.dic
    - assets/voicevox/open_jtalk_dic_utf_8-1.11/unk.dic
    - assets/splash_design.png
    - assets/icon/vocaflow_icon_1024_coral.png
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
    - family: NotoSerifJP
      fonts:
        - asset: assets/fonts/NotoSerifJP-Variable.ttf
    - family: SourceHanSerifJP
      fonts:
        - asset: assets/fonts/SourceHanSerifJP-Regular.otf

